[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Konfigurasi Baud Rate Serial Monitor
monitor_speed = 115200

; Library Dependencies ECO Watt (Full Offline via Bluetooth)
; CATATAN MIGRASI WiFi -> Bluetooth:
; - ESPAsyncWebServer, AsyncTCP, dan Universal-Arduino-Telegram-Bot dihapus
;   karena Web Dashboard & fitur Telegram sudah tidak dipakai.
; - board_build.filesystem=littlefs dihapus, folder /data (html/css/js) juga
;   tidak lagi dipakai karena kontrol sekarang lewat app mobile via BLE GATT.
; - BLEDevice/BLEScan bawaan Arduino-ESP32 (stack Bluedroid) diganti dengan
;   NimBLE-Arduino: jauh lebih hemat RAM dan didesain untuk menjalankan
;   Central (scan presensi) + Peripheral (GATT server) secara bersamaan
;   (dual-role), yang tidak bisa diandalkan pada stack Bluedroid bawaan.
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    mandulaj/PZEM-004T-v30 @ ^1.1.2
    h2zero/NimBLE-Arduino @ ^1.4.1
